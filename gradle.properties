# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Fork: the version of the mod (the APK is named after it: jellyfin-mod-<version>-<flavor>-<type>.apk,
# the server offers the highest one from its "clients" folder)
jellyfin.version=14.0.0
